name: athena-dae-kernel

# 目标：从设备同源提交 63c7fdb 编出 BTF + cls_bpf.ko + veth.ko，走免刷机路线。
#
# 与旧版的区别（旧版连续失败 3 次）：
#   1. 废弃"阶段一原样编 / 阶段二注入"的双阶段流程。OpenWrt 的 stamp 机制会让
#      第二次 target/linux/compile 在 0.06 秒内直接跳过，配置根本没生效。
#   2. 配置一次性写到位再开编：
#      - CONFIG_KERNEL_DEBUG_INFO_REDUCED 必须显式关闭。BTF 在 Kconfig 里
#        depends on !DEBUG_INFO_REDUCED，而 OpenWrt 默认开 REDUCED，
#        只在内核 config 片段里写 "# ... is not set" 会被后面追加的
#        CONFIG_KERNEL_* 覆盖（这是第 5 轮只出 .debug_info 不出 .BTF 的真因）。
#      - veth / cls_bpf 走官方 kmod 包选择路径，同时保留内核片段做双保险。
#   3. 编完先断言 .config.set 里关键项，不合格直接停，不浪费提取步骤。
#   4. 若 .BTF 仍缺失，现场用 pahole 从 DWARF 生成；pahole 版本不够就源码编 dwarves。

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: "额外构建完整 sysupgrade 镜像（耗时长，刷机才需要）"
        type: boolean
        default: false

env:
  COMMIT: 63c7fdb3c9685d9f497d6128d9280a772f77562d
  KVER: 6.18.55
  WORK: /mnt/athena-build
  DEVICE: jdcloud_re-cs-02

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 环境准备
        run: |
          nproc; free -h; df -h /mnt /
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev libssl-dev \
            libelf-dev dwarves zstd bc rsync unzip git python3 bison flex time \
            cmake libdw-dev zlib1g-dev pkg-config
          pahole --version || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo mkdir -p "$WORK"
          sudo chown -R "$(id -u):$(id -g)" "$WORK"
          test -w "$WORK" || { echo "WORK 不可写"; exit 1; }
          AVAIL=$(df -Pk "$WORK" | awk 'NR==2{printf "%d", $4/1024/1024}')
          echo "WORK=$WORK 可用=${AVAIL}GB"
          test "$AVAIL" -ge 30 || { echo "空间不足 30GB"; exit 1; }

      - name: 拉取源码并锁定提交
        run: |
          cd "$WORK"
          mkdir -p src && cd src
          git init -q .
          git remote add origin https://github.com/immortalwrt/immortalwrt.git
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --format='%H %ci %s' | cut -c1-120
          head -8 feeds.conf.default 2>/dev/null || true

      - name: 生成配置（一次性写到位）
        run: |
          cd "$WORK/src"
          cat > .config <<'CONF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_TARGET_DEVICE_PACKAGES_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=""
          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          # CONFIG_KERNEL_DEBUG_INFO_BTF is not set
          CONFIG_KERNEL_KALLSYMS=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONF
          sed -i 's/^          //' .config
          echo "--- seed ---"; cat .config
          make defconfig >/dev/null 2>&1
          echo "--- defconfig 后关键项 ---"
          grep -E 'KERNEL_DEBUG_INFO|kmod-veth|kmod-sched-bpf|TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud' .config || echo "缺失"

      - name: 注入内核片段（双保险）
        run: |
          cd "$WORK/src"
          KCFG=$(ls target/linux/qualcommax/config-6.18 2>/dev/null || ls target/linux/qualcommax/config-* | tail -1)
          echo "target config -> $KCFG"
          cat >> "$KCFG" <<'EOF'

          # ATHENA_DAE_FRAGMENT begin
          # CONFIG_DEBUG_INFO_REDUCED is not set
          CONFIG_DEBUG_INFO=y
          CONFIG_NET_CLS_BPF=m
          CONFIG_NET_SCH_CLSACT=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_INGRESS=y
          CONFIG_NET_EGRESS=y
          CONFIG_VETH=m
          CONFIG_KPROBES=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_CGROUPS=y
          # ATHENA_DAE_FRAGMENT end
          EOF
          sed -i 's/^          //' "$KCFG"
          tail -20 "$KCFG"

      - name: 下载源码包
        run: |
          cd "$WORK/src"
          make -j"$(nproc)" download >/dev/null 2>&1 || make -j1 download 2>&1 | tail -20

      - name: 构建工具链
        run: |
          cd "$WORK/src"
          make -j"$(nproc)" toolchain/install 2>&1 | tail -20

      - name: 编译内核与 kmod
        run: |
          cd "$WORK/src"
          make -j"$(nproc)" target/linux/compile 2>&1 | tail -40
          make -j"$(nproc)" package/kernel/linux/compile 2>&1 | tail -20

      - name: 断言配置真的生效
        run: |
          cd "$WORK/src"
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq60xx/linux-$KVER | head -1)
          test -n "$KDIR" || { echo "找不到内核构建目录"; exit 1; }
          echo "KDIR=$KDIR"
          echo "--- 关键项 ---"
          for k in CONFIG_DEBUG_INFO= CONFIG_DEBUG_INFO_REDUCED CONFIG_VETH CONFIG_NET_CLS_BPF CONFIG_KPROBES; do
            printf '%-30s %s\n' "$k" "$(grep -E "^$k" "$KDIR/.config.set" | head -1)"
          done
          fail=0
          grep -q '^CONFIG_VETH=m' "$KDIR/.config.set" || { echo "::error::CONFIG_VETH 不是 m"; fail=1; }
          grep -q '^CONFIG_NET_CLS_BPF=m' "$KDIR/.config.set" || { echo "::error::CONFIG_NET_CLS_BPF 不是 m"; fail=1; }
          grep -q '^CONFIG_DEBUG_INFO_REDUCED=y' "$KDIR/.config.set" && { echo "::error::DEBUG_INFO_REDUCED 仍为 y"; fail=1; }
          echo "fail=$fail"
          exit $fail

      - name: 生成 BTF
        run: |
          cd "$WORK/src"
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq60xx/linux-$KVER | head -1)
          VM="$KDIR/vmlinux"
          ls -l "$VM"; file "$VM" || true
          OB=$(ls staging_dir/toolchain-*/bin/*-objcopy | head -1)
          RE=$(ls staging_dir/toolchain-*/bin/*-readelf | head -1)
          [ -n "$OB" ] || OB=objcopy
          [ -n "$RE" ] || RE=readelf
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          BTF="$GITHUB_WORKSPACE/artifacts/vmlinux-$KVER"
          if $RE -S "$VM" 2>/dev/null | grep -q '\.BTF'; then
            echo "内核自带 .BTF，直接抽取"
          else
            echo "内核无 .BTF，手工用 pahole 生成"
            if ! pahole -J "$VM" 2>/tmp/pahole.err; then
              echo "系统 pahole 失败，源码编译 dwarves"
              cat /tmp/pahole.err || true
              git clone -q --depth 1 https://github.com/acmel/dwarves.git /tmp/dwarves
              cmake -S /tmp/dwarves -B /tmp/dwarves/build -D__LIB=lib -DBUILD_SHARED_LIBS=off >/dev/null
              make -C /tmp/dwarves/build -j"$(nproc)" >/dev/null 2>&1
              /tmp/dwarves/build/pahole --version
              /tmp/dwarves/build/pahole -J "$VM"
            fi
          fi
          $OB --dump-section .BTF="$BTF" "$VM" /dev/null
          MAGIC=$(od -An -tx1 -N2 "$BTF" | tr -d ' \n')
          echo "btf_magic=$MAGIC  btf_size=$(wc -c < "$BTF")"
          test "$MAGIC" = "9feb"

      - name: 提取 kmod 与证据
        if: always()
        run: |
          cd "$WORK/src"
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq60xx/linux-$KVER | head -1)
          A="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$A"
          cp "$KDIR/net/sched/cls_bpf.ko" "$A/" 2>/dev/null || echo "!! cls_bpf.ko 缺失"
          cp "$KDIR/drivers/net/veth.ko" "$A/" 2>/dev/null || echo "!! veth.ko 缺失"
          cp "$KDIR/.config.set" "$A/kernel.config.set" 2>/dev/null || true
          cp "$KDIR/.vermagic" "$A/vermagic.txt" 2>/dev/null || true
          for m in "$A"/*.ko; do [ -f "$m" ] && echo "$(basename "$m") => $(strings "$m" | grep -m1 '^vermagic=')"; done
          cd "$A" && sha256sum ./* > SHA256SUMS 2>/dev/null; cat SHA256SUMS; ls -lh

      - name: 结构体尺寸证据
        if: always()
        run: |
          cd "$WORK/src"
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq60xx/linux-$KVER | head -1)
          A="$GITHUB_WORKSPACE/artifacts"; mkdir -p "$A"
          P=pahole; [ -x /tmp/dwarves/build/pahole ] && P=/tmp/dwarves/build/pahole
          OUT="$A/struct-sizes.txt"; : > "$OUT"
          for s in sk_buff nf_conn files_struct signal_struct sighand_struct socket_alloc \
                   task_struct mm_struct dentry pid tcp_sock udp_sock raw_sock anon_vma \
                   net_device napi_struct bpf_prog tcf_proto Qdisc nf_hook_ops sock net; do
            sz=$($P -C "$s" "$KDIR/vmlinux" 2>/dev/null | grep -oE 'size: [0-9]+' | head -1 | cut -d' ' -f2)
            echo "$s ${sz:-?}" >> "$OUT"
          done
          cat "$OUT"

      - name: 完整镜像（可选）
        if: ${{ inputs.build_image }}
        run: |
          cd "$WORK/src"
          make -j"$(nproc)" 2>&1 | tail -20
          cp bin/targets/qualcommax/ipq60xx/*sysupgrade* "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-dae-kernel-${{ github.run_id }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
